# Runtime configuration for shared infrastructure, external market-data integrations,
# and cache backends.
# Environment variables still override these values when present.

clickhouse:
  dsn: "clickhouse://default:@localhost:9000/default"

mysql:
  dsn: ""
  host: "127.0.0.1:3306"
  user: "toktik"
  password: ""
  database: "toktik"

api_server:
  listen_addr: ":9010"
  read_header_timeout_seconds: 10
  read_timeout_seconds: 30
  write_timeout_seconds: 180
  idle_timeout_seconds: 120
  warmup_refresh_interval_hours: 22
  warmup_cooldown_hours: 20

api:
  cors_origins: []
  api_keys: []
  rate_limit_rps: 50
  request_timeout_seconds: 180
  # "dev" or "prod"
  environment: "prod"

paths:
  schema_dir: "schema/clickhouse"

deribit:
  base_url: "https://www.deribit.com"

tiger:
  tiger_id: ""
  private_key: ""
  account: ""
  license: ""
  environment: ""
  language: ""
  timezone: ""
  timeout_seconds: 0
  enable_dynamic_domain: true
  token: ""
  token_file: ""
  server_url: ""
  device_id: ""

polygon:
  api_key: ""
  base_url: "https://api.massive.com"
  flat_files_base_url: "https://files.massive.com/flatfiles"
  flat_files_tool: "mc"
  flat_files_cache_dir: "tmp/polygon"
  flat_files_access_key: ""
  flat_files_secret_key: ""
  timeout_seconds: 60
  trace: false
  pagination: true

fmp:
  cache_dir: "/mnt/hdd/toktik/fmp-cache"
  api_key: ""

latest_market_data:
  enabled: false
  redis_ttl_hours: 72
  open_refresh_interval_minutes: 180
  closed_refresh_interval_minutes: 360
  stale_alert_after_hours: 6
  refresh_timeout_minutes: 15
  workers: 4
  stock_provider: "fmp"
  option_provider: "polygon"
  smoke_symbols: ["SPY", "QQQ", "AAPL", "NVDA"]
  always_refresh_symbols: ["SPY", "QQQ", "AAPL", "NVDA", "HYG", "UUP", "CRED"]
  option_chain_limit: 250
  option_aggregate_limit: 180

redis:
  enabled: false
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  key_prefix: "toktik"
  dial_timeout_seconds: 2
  read_timeout_seconds: 2
  write_timeout_seconds: 2

# Hex-encoded AES key (16, 24, or 32 bytes) for encrypting credentials in memory.
# Generate with: openssl rand -hex 32
# Leave empty to disable encryption (credentials stored as plaintext in memory).
aes_key: ""
