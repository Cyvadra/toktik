runner:
  max_source_concurrency: 1
  overlap_days: 1
  audit_enabled: true
  audit_lookback_days: 7
  audit_max_findings: 50
  lock_ttl: 2h
  db_retry_max_attempts: 5
  db_retry_initial_delay: 10s
  db_retry_max_delay: 2m
  default_per_job_timeout: ""
  default_per_source_timeout: ""

jobs:
  cboe_vix_macro:
    enabled: true
    dataset: cboe-vix
    url: "https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv"
    reference_symbol: SPY
    batch_size: 1000
    cold_start_floor: 1990-01-01

  deribit_dvol_macro:
    enabled: true
    symbols: [BTC, ETH]
    batch_size: 1000
    cold_start_floor: 2022-01-01

  guru_macro:
    enabled: true
    dataset: gurufocus-shiller
    url: "https://www.gurufocus.cn/_api/indicator/shiller_pe/data?locale=zh-hans"
    reference_symbol: SPY
    batch_size: 1000

  fmp_sp500_macro:
    enabled: true
    depends_on: [polygon_us_flatfiles]
    dataset: fmp-sp500-shiller
    constituent_universe: sp500
    price_symbol: SPY
    reference_symbol: SPY
    workers: 6
    batch_size: 1000
    rolling_quarters: 40
    min_quarters: 40
    cold_start_floor: 2016-01-01

  fmp_nasdaq100_macro:
    enabled: true
    depends_on: [polygon_us_flatfiles]
    dataset: fmp-nasdaq100-shiller
    constituent_universe: nasdaq100
    price_symbol: QQQ
    reference_symbol: QQQ
    workers: 6
    batch_size: 1000
    rolling_quarters: 40
    min_quarters: 40
    cold_start_floor: 2016-01-01

  fmp_crypto_spot:
    enabled: false
    resolve_at_startup: true
    interval: 1min
    batch_size: 50000

  fmp_forex:
    enabled: false
    symbols_file: signal-list/forex-fmp-watchlist.txt
    resolve_at_startup: true
    interval: 1min
    batch_size: 50000

  fmp_us_stocks:
    enabled: false
    depends_on: [polygon_us_flatfiles]
    resolve_at_startup: true
    include_option_gap_mappings: true
    interval: 1min
    batch_size: 50000

  fmp_us_stock_splits:
    enabled: true
    depends_on: [polygon_us_flatfiles]
    resolve_at_startup: true
    overlap_days: 3
    batch_size: 1000
    cold_start_floor: 1990-01-01

  fmp_us_stock_profiles:
    enabled: true
    depends_on: [polygon_us_flatfiles]
    resolve_at_startup: true
    include_option_gap_mappings: true
    batch_size: 25
    workers: 4

  fmp_us_fundamentals:
    enabled: true
    depends_on: [polygon_us_flatfiles, fmp_us_stock_profiles]
    provider: fmp
    incremental_mode: sec-filings-financials
    discovery_page_size: 250
    discovery_page_limit: 0
    workers: 2
    batch_size: 1000
    page_size: 251
    qps: 10
    fmp_quarter_limit: 40

  fmp_etf_fundamentals:
    enabled: true
    depends_on: [fmp_us_fundamentals]
    symbols: [SPY, IWM, NDX, FIX, KWEB]
    symbol_mappings:
      NDX: QQQ
    batch_size: 1000
    qps: 10
    min_coverage: 0.8

  fmp_economic_calendar:
    enabled: true
    cold_start_floor: 2026-01-01

  fmp_observed_stock_calendar:
    enabled: true
    depends_on: [fmp_us_fundamentals, fmp_us_stock_profiles]
    cold_start_floor: 2026-01-01

  polygon_us_flatfiles:
    enabled: true
    batch_size: 100000
    workers: 2
    risk_free_rate: 0.05
    force_download: false
    # Stocks and options market data are imported from Polygon flat files.
    sync_stocks: true
    sync_options: true
    # Source interval for Polygon flatfiles: "1m" (default, minute aggregates)
    # or "1d" (day aggregates). When set to "1d", the pipeline downloads and
    # imports Polygon day aggregate files into daily staging tables and
    # materializes them into the existing us_*_bar_1d query views.
    # In daily-only mode, disable fmp_us_stocks, polygon_us_greeks, and
    # feature_store_backfill since they depend on 1m data.
    # source_interval: 1d

  polygon_us_greeks:
    enabled: true
    depends_on: [polygon_us_flatfiles]
    batch_size: 100000
    workers: 2
    risk_free_rate: 0.05
    rebuild_aggregates: true

  feature_store_backfill:
    enabled: true
    depends_on: [polygon_us_greeks]
    markets: [us-options]
    priority_order: us-default
    lookback_days: 252
    min_days_to_expiry: 0
    max_days_to_expiry: 365
    workers: 4
    replace: true
    cold_start_floor: 2022-01-01
