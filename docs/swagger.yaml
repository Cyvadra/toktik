host: localhost:9010
info:
  contact:
    email: dev@toktik.dev
    name: Toktik Dev Team
    url: https://toktik.dev
  description: Backend data services for multi-market options analytics, including
    market data retrieval, feature/factor queries, screening, strategy catalog, and
    backtesting.
  license:
    name: Proprietary
    url: https://toktik.dev/license
  termsOfService: https://toktik.dev/terms
  title: Toktik Options Platform API
  version: "1.0"
paths:
  /backtests/runs:
    post:
      consumes:
      - application/json
      description: Submits a strategy backtest run that executes asynchronously. Poll
        the run status via GET /backtests/runs/:runID.
      parameters:
      - description: Backtest run configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StrategyBacktestRunRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StrategyBacktestRunAccepted'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Start an async strategy backtest
      tags:
      - Backtests
  /backtests/runs/{runID}:
    get:
      description: Returns the current status and results of a strategy backtest run.
      parameters:
      - description: Backtest run ID
        in: path
        name: runID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StrategyBacktestRunStatus'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get backtest run status
      tags:
      - Backtests
  /backtests/runs/{runID}/events:
    get:
      description: Returns a server-sent events stream for real-time backtest progress
        updates.
      parameters:
      - description: Backtest run ID
        in: path
        name: runID
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream of backtest events
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Stream backtest run events (SSE)
      tags:
      - Backtests
  /backtests/runs/{runID}/report:
    get:
      description: Returns the reserved HTML report for a backtest run. Before completion,
        it returns 202 with the current run status.
      parameters:
      - description: Backtest run ID
        in: path
        name: runID
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: HTML report
          schema:
            type: string
        "202":
          description: Run status while report is not ready
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StrategyBacktestRunStatus'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get primary backtest report
      tags:
      - Backtests
  /backtests/runs/{runID}/reports/{reportID}:
    get:
      description: Returns an HTML report variant for a backtest run. Use reportID=overview
        for the overview page or 1..N for per-strategy detail pages.
      parameters:
      - description: Backtest run ID
        in: path
        name: runID
        required: true
        type: string
      - description: 'Report selector: overview or 1..N'
        in: path
        name: reportID
        required: true
        type: string
      produces:
      - application/json
      - text/html
      responses:
        "200":
          description: HTML report
          schema:
            type: string
        "202":
          description: Run status while report is not ready
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StrategyBacktestRunStatus'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get a named backtest report
      tags:
      - Backtests
  /crypto-options/backtest:
    post:
      consumes:
      - application/json
      deprecated: true
      description: 'Runs a synchronous backtest on a crypto options strategy. Deprecated:
        use POST /backtests/runs instead.'
      parameters:
      - description: Backtest configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.BacktestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Run crypto options backtest (legacy, sync)
      tags:
      - CryptoOptions
  /crypto-options/bars:
    get:
      description: Returns OHLCV bars with Greeks and IV for a crypto option symbol.
      parameters:
      - description: Option symbol
        in: query
        name: symbol
        required: true
        type: string
      - description: Bar interval (1m,5m,15m,30m,1h,2h,4h,1d)
        in: query
        name: interval
        required: true
        type: string
      - description: Start time (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: End time (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      - description: Max rows (default 1000, max 10000)
        in: query
        name: limit
        type: integer
      - description: Opaque pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.BarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get crypto option bars
      tags:
      - CryptoOptions
  /crypto-options/greeks:
    get:
      description: Returns Greeks snapshots over time for a crypto option symbol.
      parameters:
      - description: Option symbol
        in: query
        name: symbol
        required: true
        type: string
      - description: Bar interval (default 1m)
        in: query
        name: interval
        type: string
      - description: Start time (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: End time (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      - description: Max rows (default 1000, max 10000)
        in: query
        name: limit
        type: integer
      - description: Opaque pagination cursor
        in: query
        name: cursor
        type: string
      produces:
