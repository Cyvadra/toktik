paths:
  /backtests/runs:
    post:
      consumes:
      - application/json
      description: Submits a strategy backtest run that executes asynchronously. Poll
        the run status via GET /backtests/runs/:runID.
      parameters:
      - description: Backtest run configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StrategyBacktestRunRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StrategyBacktestRunAccepted'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Start an async strategy backtest
      tags:
      - Backtests
  /backtests/runs/{runID}:
    get:
      description: Returns the current status and results of a strategy backtest run.
      parameters:
      - description: Backtest run ID
        in: path
        name: runID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StrategyBacktestRunStatus'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get backtest run status
      tags:
      - Backtests
  /backtests/runs/{runID}/events:
    get:
      description: Returns a server-sent events stream for real-time backtest progress
        updates.
      parameters:
      - description: Backtest run ID
        in: path
        name: runID
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream of backtest events
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Stream backtest run events (SSE)
      tags:
      - Backtests
  /backtests/runs/{runID}/report:
    get:
      description: Returns the reserved HTML report for a backtest run. Before completion,
        it returns 202 with the current run status.
      parameters:
      - description: Backtest run ID
        in: path
        name: runID
        required: true
        type: string
      produces:
      - text/html
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StrategyBacktestRunStatus'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get primary backtest report
      tags:
      - Backtests
  /backtests/runs/{runID}/reports/{reportID}:
    get:
      description: Returns an HTML report variant for a backtest run. Use reportID=overview
        for the overview page or 1..N for per-strategy detail pages.
      parameters:
      - description: Backtest run ID
        in: path
        name: runID
        required: true
        type: string
      - description: 'Report selector: overview or 1..N'
        in: path
        name: reportID
        required: true
        type: string
      produces:
      - text/html
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StrategyBacktestRunStatus'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get a named backtest report
      tags:
      - Backtests
