      summary: Get US option trades via Polygon
      tags:
      - Polygon
  /polygon/stocks/aggregates:
    get:
      description: Proxies Polygon aggregate bars for historical or near-realtime
        stock data with short-TTL caching and an optional 90-day stale fallback when
        Polygon is unavailable.
      parameters:
      - description: Stock ticker symbol
        in: query
        name: ticker
        required: true
        type: string
      - description: Aggregate multiplier
        in: query
        name: multiplier
        type: integer
      - description: Timespan (minute,hour,day,...)
        in: query
        name: timespan
        required: true
        type: string
      - description: Start time (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: End time (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      - description: Adjusted results
        in: query
        name: adjusted
        type: boolean
      - description: Sort direction
        in: query
        name: sort
        type: string
      - description: Page size
