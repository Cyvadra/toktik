host: localhost:9010
info:
  contact:
    email: dev@toktik.dev
    name: Toktik Dev Team
    url: https://toktik.dev
  description: Backend data services for multi-market analytics, including market
    data retrieval, feature/factor/fundamental queries, screening, strategy catalog,
    and backtesting.
  license:
    name: Proprietary
    url: https://toktik.dev/license
  termsOfService: https://toktik.dev/terms
  title: Toktik Options Platform API
  version: "1.0"
paths:
  /deribit/options/chain:
    get:
      description: Returns a realtime Deribit option chain. Option premium prices
        use the native premium currency; implied volatility is returned as a decimal.
      parameters:
      - description: Underlying currency (for example BTC or ETH)
        in: query
        name: underlying
        required: true
        type: string
      - description: Historical UTC date (YYYY-MM-DD); returns the final available
          local snapshot for that date
        in: query
        name: date
        type: string
      - description: Exact expiration date (YYYY-MM-DD)
        in: query
        name: expiration_date
        type: string
      - description: Minimum expiration date
        in: query
        name: expiration_date_gte
        type: string
      - description: Expiration date greater than
        in: query
        name: expiration_date_gt
        type: string
      - description: Maximum expiration date
        in: query
        name: expiration_date_lte
        type: string
      - description: Expiration date less than
        in: query
        name: expiration_date_lt
        type: string
      - description: call or put
        in: query
        name: contract_type
        type: string
      - description: Exact strike price
        in: query
        name: strike_price
        type: number
      - description: Minimum strike price
        in: query
        name: strike_price_gte
        type: number
      - description: Strike price greater than
        in: query
        name: strike_price_gt
        type: number
      - description: Maximum strike price
        in: query
        name: strike_price_lte
        type: number
      - description: Strike price less than
        in: query
        name: strike_price_lt
        type: number
      - description: Sort direction (asc or desc)
        in: query
        name: order
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      - description: Maximum contracts (max 1000; zero returns all)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.DeribitOptionChainResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get realtime crypto option chain snapshot via Deribit
      tags:
      - Deribit
  /deribit/options/chain/history:
    get:
      description: Returns local end-of-day option-chain snapshots for each UTC date
        in the inclusive range. Each snapshot's contracts use the realtime Deribit
        option-chain structure.
      parameters:
      - description: Underlying currency (for example BTC or ETH)
        in: query
        name: underlying
        required: true
        type: string
      - description: First historical UTC date (YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: Last historical UTC date (YYYY-MM-DD), inclusive
        in: query
        name: to
        required: true
        type: string
      - description: Exact expiration date (YYYY-MM-DD)
        in: query
        name: expiration_date
        type: string
      - description: call or put
        in: query
        name: contract_type
        type: string
      - description: Sort direction (asc or desc)
        in: query
        name: order
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      - description: Maximum contracts per snapshot (max 1000; zero returns all)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.DeribitOptionChainHistoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get historical crypto option chain snapshots
      tags:
      - Deribit
  /polygon/options/aggregates:
    get:
      description: Proxies Polygon aggregate bars for a US option contract over a
        requested time window.
      parameters:
      - description: Option ticker
        in: query
        name: ticker
        required: true
        type: string
      - description: Aggregate multiplier
        in: query
        name: multiplier
        type: integer
      - description: Timespan (minute,hour,day,...)
        in: query
        name: timespan
        required: true
        type: string
      - description: Start time (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: End time (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      - description: Adjusted results
        in: query
        name: adjusted
        type: boolean
      - description: Sort direction
        in: query
        name: sort
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.PolygonAggregateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get US option aggregate bars via Polygon
      tags:
      - Polygon
  /polygon/options/chain:
    get:
      description: Proxies Polygon option chain snapshots for a US underlying. When
        stale cache fallback is enabled, successful responses remain available for
        90 days when Polygon is unavailable.
      parameters:
      - description: Underlying ticker symbol
        in: query
        name: underlying
        required: true
        type: string
      - description: Exact expiration date
        in: query
        name: expiration_date
        type: string
      - description: Minimum expiration date
        in: query
        name: expiration_date_gte
        type: string
      - description: Expiration date greater than
        in: query
        name: expiration_date_gt
        type: string
      - description: Maximum expiration date
        in: query
        name: expiration_date_lte
        type: string
      - description: Expiration date less than
        in: query
        name: expiration_date_lt
        type: string
      - description: call or put
        in: query
        name: contract_type
        type: string
      - description: Exact strike price
        in: query
        name: strike_price
        type: number
      - description: Minimum strike price
        in: query
        name: strike_price_gte
        type: number
      - description: Strike price greater than
        in: query
        name: strike_price_gt
        type: number
      - description: Maximum strike price
        in: query
        name: strike_price_lte
        type: number
      - description: Strike price less than
        in: query
        name: strike_price_lt
        type: number
      - description: Sort direction
        in: query
        name: order
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      - description: Page size (max 250)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.PolygonOptionChainResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get realtime US option chain snapshot via Polygon
      tags:
      - Polygon
  /polygon/options/contract:
    get:
      description: Returns static contract metadata for a single OCC-style Polygon
        option ticker.
      parameters:
      - description: Option ticker, e.g. O:SPY251219C00650000
        in: query
        name: ticker
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.PolygonOptionContractResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get US option contract metadata via Polygon
      tags:
      - Polygon
  /polygon/options/quotes:
    get:
      description: Proxies Polygon quote history for a US option contract.
      parameters:
      - description: Option ticker
        in: query
        name: ticker
        required: true
        type: string
      - description: Exact timestamp
        in: query
        name: timestamp
        type: string
      - description: Timestamp greater than or equal
        in: query
        name: timestamp_gte
        type: string
      - description: Timestamp greater than
        in: query
        name: timestamp_gt
        type: string
      - description: Timestamp less than or equal
        in: query
        name: timestamp_lte
        type: string
      - description: Timestamp less than
        in: query
        name: timestamp_lt
        type: string
      - description: Sort order
        in: query
        name: order
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.PolygonQuoteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get US option quotes via Polygon
      tags:
      - Polygon
  /polygon/options/trades:
    get:
      description: Proxies Polygon trade history for a US option contract.
      parameters:
      - description: Option ticker
        in: query
        name: ticker
        required: true
        type: string
      - description: Exact timestamp
        in: query
        name: timestamp
        type: string
      - description: Timestamp greater than or equal
        in: query
        name: timestamp_gte
        type: string
      - description: Timestamp greater than
        in: query
        name: timestamp_gt
        type: string
      - description: Timestamp less than or equal
        in: query
        name: timestamp_lte
        type: string
      - description: Timestamp less than
        in: query
        name: timestamp_lt
        type: string
      - description: Sort order
        in: query
        name: order
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
