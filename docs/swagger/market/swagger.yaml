  /screener/options:
    get:
      description: Filters and ranks individual option contracts by Greeks, volume,
        open interest, and other criteria.
      parameters:
      - description: Market (crypto-options, us-options)
        in: query
        name: market
        required: true
        type: string
      - description: Filter by underlying
        in: query
        name: underlying
        type: string
      - description: Option type (call, put)
        in: query
        name: type
        type: string
      - description: Minimum days to expiry
        in: query
        name: min_dte
        type: integer
      - description: Maximum days to expiry
        in: query
        name: max_dte
        type: integer
      - description: Sort field
        in: query
        name: sort_by
        type: string
      - description: Sort order (asc, desc)
        in: query
        name: order
        type: string
      - description: For market=us-options, overlay Redis-cached provisional latest
          option-chain data. Screener endpoints default this to true.
        in: query
        name: include_latest
        type: boolean
      - description: Max rows (default 50)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ScreenOptionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Screen option contracts
      tags:
      - Screener
  /screener/underlyings:
    get:
      description: Filters and ranks underlying assets by IV, volume, and other criteria.
      parameters:
      - description: Market (crypto-options, us-options)
        in: query
        name: market
        required: true
        type: string
      - description: Sort field
        in: query
        name: sort_by
        type: string
      - description: Sort order (asc, desc)
        in: query
        name: order
        type: string
      - description: For market=us-options, overlay Redis-cached provisional latest
          option-chain data. Screener endpoints default this to true.
        in: query
        name: include_latest
        type: boolean
      - description: Max rows (default 50)
        in: query
        name: limit
