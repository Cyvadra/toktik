      summary: Screen underlyings
      tags:
      - Screener
  /screener/us-underlyings/turnover-intersection:
    get:
      description: Intersects the top US stocks and US options underlyings by trailing
        turnover, then returns the most liquid shared names.
      parameters:
      - description: Max rows to return (default 100)
        in: query
        name: limit
        type: integer
      - description: Trailing trading days to aggregate (default 20)
        in: query
        name: lookback_days
        type: integer
      - description: Restrict to stock underlyings with PE/PB fundamentals coverage,
          then exclude ETF/fund classifications from cached company profiles
        in: query
        name: non_etf_only
        type: boolean
      - description: Accepted for screener API consistency and defaulted to true,
          but turnover-intersection rankings remain based on historical aggregated
          turnover.
        in: query
        name: include_latest
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ScreenUSTurnoverIntersectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Screen US underlyings by shared turnover
      tags:
      - Screener
  /utils/us-stocks/logos/{symbol}:
    get:
      description: Returns a US stock logo as an image-like URL. Use `/utils/us-stocks/logos/AAPL.png`
        directly in image tags or clients. The endpoint does not require an API key.
        If the logo is cached in MySQL it is returned immediately; otherwise the server
        tries FMP in real time, stores the logo as base64 in MySQL, and returns it.
        Symbols that failed FMP lookup in the last 24 hours return a generated default
        PNG icon.
      parameters:
      - description: 'Ticker plus image suffix, for example AAPL.png. Supported suffixes:
          .png, .jpg, .jpeg, .svg, .webp.'
        in: path
        name: symbol
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: Logo image bytes
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get US stock logo image
      tags:
      - Utilities
