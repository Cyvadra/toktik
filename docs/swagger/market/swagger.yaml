        type: string
      - description: Start time (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: End time (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      - description: Apply split adjustment to OHLC prices (defaults to true); set
          false for raw unadjusted prices.
        in: query
        name: adjusted
        type: boolean
      - collectionFormat: csv
        description: Optional fundamentals to align onto each bar (repeat or comma-separated,
          e.g. pe,pb). PE/PB are recomputed from each bar close using the latest known
          filing-derived denominator.
        in: query
        items:
          type: string
        name: factor
        type: array
      - description: Merge Redis-cached provisional latest daily bars when interval=1d.
          This never calls upstream providers and defaults to false.
        in: query
        name: include_latest
        type: boolean
      - description: Max rows (default 1000)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.USStockBarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get US stock bars
      tags:
      - USStocks
