host: localhost:9010
info:
  contact:
    email: dev@toktik.dev
    name: Toktik Dev Team
    url: https://toktik.dev
  description: Backend data services for multi-market analytics, including market
    data retrieval, feature/factor/fundamental queries, screening, strategy catalog,
    and backtesting.
  license:
    name: Proprietary
    url: https://toktik.dev/license
  termsOfService: https://toktik.dev/terms
  title: Toktik Options Platform API
  version: "1.0"
paths:
  /calendar/economic:
    get:
      description: Returns the persisted macro economic calendar from MySQL for the
        requested window, or the default window (today-7d to today+30d) when omitted.
        Refresh is handled by the fmp_economic_calendar data-sync-pipeline job.
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.EconomicCalendarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get economic calendar
      tags:
      - Calendar
  /calendar/stocks:
    post:
      consumes:
      - application/json
      description: Returns persisted calendar events for an observed US stock pool
        from MySQL. The request body accepts symbols, optional from/to date window,
        optional event types, and earnings_only for Finnhub-replacement earnings calendar
        use cases. Refresh is handled by the fmp_observed_stock_calendar data-sync-pipeline
        job.
      parameters:
      - description: Stock calendar request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StockCalendarRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.StockCalendarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get stock calendar
      tags:
      - Calendar
  /factors:
    get:
      description: Returns metadata for all registered factor feeds, including supported
        symbols, windows, and fields.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.FactorCatalogResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: List available factor feeds
      tags:
      - Factors
  /factors/bars:
    get:
      description: Returns OHLC bars for a specific factor feed, symbol, and time
        window.
      parameters:
      - description: Factor feed name (e.g. dvol)
        in: query
        name: name
        required: true
        type: string
      - description: Symbol (e.g. BTC)
        in: query
        name: symbol
        required: true
        type: string
      - description: Time window (e.g. 1h, 1d)
        in: query
        name: window
        required: true
        type: string
      - description: Start time (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: End time (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      - description: Max rows (default 1000, max 10000)
        in: query
        name: limit
        type: integer
      - description: Opaque pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.FactorBarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Query factor time-series data
      tags:
      - Factors
  /features/daily-feature-panel:
    get:
      description: Returns a consolidated daily panel with volatility, term structure,
        liquidity, and event features. Precomputed panel queries scan up to 7 calendar
        days before the requested start date so empty feature fields can be backfilled
        from the nearest earlier valid row while keeping the response clipped to the
        requested range.
      parameters:
      - description: Market (crypto-options, us-options)
        in: query
        name: market
        required: true
        type: string
      - description: Underlying asset symbol
        in: query
        name: underlying
        required: true
        type: string
      - description: Start date (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: End date (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      - description: IV percentile lookback window (default 252)
        in: query
        name: lookback_days
        type: integer
      - description: Min DTE filter
        in: query
        name: min_days_to_expiry
        type: integer
      - description: Max DTE filter
        in: query
        name: max_days_to_expiry
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.FeatureDailyPanelResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Cyvadra_toktik_internal_dto.ErrorResponse'
      summary: Get daily feature panel
      tags:
      - Features
